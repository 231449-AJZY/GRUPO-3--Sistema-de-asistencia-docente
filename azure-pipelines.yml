# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - main        # rama que dispara el deploy
      # - develop   # puedes agregar más ramas

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: NodeTool@0          # cámbialo según tu stack
    inputs:
      versionSpec: '18.x'
    displayName: 'Instalar Node.js'

  - script: |
      npm install
      npm run build
    displayName: 'Instalar dependencias y build'

  - task: AzureWebApp@1       # o la task correspondiente a tu servicio
    inputs:
      azureSubscription: 'TU_SERVICE_CONNECTION'
      appName: 'TU_APP_NAME'
      package: '$(Build.ArtifactStagingDirectory)/**/*.zip'
